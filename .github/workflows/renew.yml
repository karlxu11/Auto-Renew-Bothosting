name: Auto Renew Bot-hosting

on:
  # Cloudflare Workers 通过 repository_dispatch 触发这个事件
  repository_dispatch:
    types: [cf_timer]

  # 保留 GitHub 网页上的手动运行入口
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        id: renew
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum python3 app.py 2>&1 | tee renew.log

      - name: 🗓️ 设置下次 Cloudflare 续期时间
        if: steps.renew.outputs.expiry_date != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          EXPIRY_DATE: ${{ steps.renew.outputs.expiry_date }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_WORKER_NAME" ]; then
            echo "::warning::未配置 Cloudflare API 凭据，跳过更新定时任务。"
            exit 0
          fi

          schedule_date=$(date --date="$EXPIRY_DATE -1 day" +%F)
          # Cloudflare Cron 以 UTC 运行：15:00 UTC 即北京时间 23:00。
          cron=$(date --date="$schedule_date" '+0 15 %-d %-m *')
          payload=$(jq -nc --arg cron "$cron" '[{cron: $cron}]')

          echo "将 ${CLOUDFLARE_WORKER_NAME} 的下一次任务设为 ${schedule_date} 23:00（北京时间；Cron: ${cron} UTC）"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/schedules" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            | jq -e '.success == true' >/dev/null

          echo "✅ Cloudflare 定时任务已更新"

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

      - name: 📦 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-log
          path: renew.log
