name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '1 1 * * *' # 每天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  # Cloudflare Workers 通过 repository_dispatch 触发这个事件
  repository_dispatch:
    types: [cf_timer]

  # 保留 GitHub 网页上的手动运行入口
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase 'requests[socks]'
          seleniumbase install chromedriver

      - name: 📥 准备 VPNGate SOCKS 服务
        env:
          VPNGATE_TO_SOCKS_REF: 337dbaffbfdf69df65f0fc8bdcf6517e45ca18db
        run: |
          set -euo pipefail
          git clone --no-checkout --filter=blob:none https://github.com/shenyanshu/vpngate-to-socks.git vpngate-to-socks
          git -C vpngate-to-socks fetch --depth 1 origin "$VPNGATE_TO_SOCKS_REF"
          git -C vpngate-to-socks checkout --detach "$VPNGATE_TO_SOCKS_REF"
          git -C vpngate-to-socks apply "$GITHUB_WORKSPACE/.github/vpngate-selection.patch"

      - name: 🚇 启动 VPNGate SOCKS5 代理
        env:
          VPNGATE_COUNTRY: JP
          VPNGATE_EXCLUDE_KEYWORD: public
        run: |
          set -euo pipefail
          docker compose -p bothosting-vpngate \
            -f .github/vpngate-compose.yml \
            up --build -d

      - name: 🔎 等待 VPNGate 节点连接
        env:
          VPNGATE_WAIT_SECONDS: '300'
        run: |
          set -euo pipefail
          python3 scripts/wait_for_vpngate.py
          echo "IS_PROXY=true" >> "$GITHUB_ENV"
          echo "PROXY_SERVER=socks5://127.0.0.1:10080" >> "$GITHUB_ENV"

      - name: 🚀 运行续期脚本
        id: renew
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum python3 app.py 2>&1 | tee renew.log

      - name: 🧾 输出 VPNGate 服务日志
        if: always()
        run: |
          docker compose -p bothosting-vpngate \
            -f .github/vpngate-compose.yml logs --tail=160 || true

      - name: 🗓️ 设置下次 Cloudflare 续期时间
        if: steps.renew.outputs.expiry_date != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          EXPIRY_DATE: ${{ steps.renew.outputs.expiry_date }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_WORKER_NAME" ]; then
            echo "::warning::未配置 Cloudflare API 凭据，跳过更新定时任务。"
            exit 0
          fi

          schedule_date=$(date --date="$EXPIRY_DATE" +%F)
          # Cloudflare Cron 以 UTC 运行：00:10 UTC 即北京时间 8:10。
          cron=$(date --date="$schedule_date" '+10 0 %-d %-m *')
          payload=$(jq -nc --arg cron "$cron" '[{cron: $cron}]')

          echo "将 ${CLOUDFLARE_WORKER_NAME} 的下一次任务设为 ${schedule_date} 8:10（北京时间；Cron: ${cron} UTC）"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/schedules" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            | jq -e '.success == true' >/dev/null

          echo "✅ Cloudflare 定时任务已更新"

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          docker compose -p bothosting-vpngate \
            -f .github/vpngate-compose.yml down --remove-orphans || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

      - name: 📦 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-log
          path: renew.log
